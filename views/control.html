<!DOCTYPE html>

<html lang="de">

<head>
    <meta charset="UTF-8">
    <title></title>

    <link href="control.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400" rel="stylesheet"/>
</head>

<body>
<template id="control-template">
    <div class="cell">
        <img alt=""
             class="preview-img"
             src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAEElEQVR42mP8z/C/HwAFAAL/AV2zNgAAAABJRU5ErkJggg=="/>

        <button class="iconBtn copyBtn">
            <span class="material-symbols-outlined">keyboard_double_arrow_up</span>
        </button>
        <button class="iconBtn pasteBtn">
            <span class="material-symbols-outlined">keyboard_double_arrow_down</span>
        </button>

        <button class="iconBtn backBtn" disabled>
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <button class="iconBtn forwardBtn" disabled>
            <span class="material-symbols-outlined">arrow_forward</span>
        </button>

        <input class="url" onkeydown="" placeholder="">

        <button class="iconBtn navigateBtn">
            <span class="material-symbols-outlined">subdirectory_arrow_right</span>
        </button>

        <button class="iconBtn screenShareBtn">
            <span class="material-symbols-outlined">screen_share</span>
        </button>

        <button class="iconBtn priorityBtn">
            <span class="material-symbols-outlined">dock_to_right</span>
        </button>
        <button class="iconBtn fullscreenBtn">
            <span class="material-symbols-outlined">fullscreen</span>
            <span class="material-symbols-outlined">fullscreen_exit</span>
        </button>
        <button class="iconBtn forceVideoBtn">
            <span class="material-symbols-outlined">hangout_video</span>
            <span class="material-symbols-outlined">hangout_video_off</span>
        </button>
    </div>
</template>

<div id="tabbar">
    <button class="active">Neuer Tab</button>
</div>

<div class="navbar">
    <button class="iconBtn backBtn" disabled id="backBtncontrol" onclick="goBack('control')">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <button class="iconBtn forwardBtn" disabled id="forwardBtncontrol" onclick="goForward('control')">
        <span class="material-symbols-outlined">arrow_forward</span>
    </button>

    <input class="url" id="urlcontrol" onkeydown="submitURL(event, 'control')" placeholder="">

    <button class="iconBtn navigateBtn" onclick="navigate('control')">
        <span class="material-symbols-outlined">subdirectory_arrow_right</span>
    </button>
</div>

<main>
    <div aria-label="Bildschirmquelle wählen" aria-modal="true" class="cap-modal cap-hidden" id="capModal"
         role="dialog">
        <div class="cap-box">
            <div class="cap-header">
                <h3>Quelle wählen</h3>

                <button class="cap-btn" id="capClose">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div aria-live="polite" class="cap-grid" id="capGrid"></div>
        </div>
    </div>
</main>

<div class="grid" id="viewContainer"></div>

<div aria-modal="true" class="cap-modal cell-modal cap-hidden" id="cellModal" role="dialog">
    <div class="cap-box">
        <div class="cap-header">
            <h3 id="cellModalTitle">View</h3>

            <button class="cap-btn" id="cellModalClose">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div id="cellModalBody"></div>
    </div>
</div>

<div class="settings-bar">
    <div class="cell full-width">
        <div class="wrapper displaySettings">
            <span class="pre-icon material-symbols-outlined">tv_displays</span>
            <label for="displaySelect">Monitor: </label>
            <div class="select-wrapper">
                <select id="displaySelect" onchange="changeDisplay()">
                    <option>Lade Monitore…</option>
                </select>
                <span class="select-arrow material-symbols-outlined">expand_more</span>
            </div>
        </div>

        <div class="wrapper gridSettings">
            <span class="pre-icon material-symbols-outlined">grid_view</span>
            <label for="gridRows">Raster: </label>
            <input class="grid-dim" id="gridRows" max="6" min="1" type="number"/>
            ×
            <input class="grid-dim" id="gridCols" max="6" min="1" type="number"/>
            <button onclick="applyGridSize()">
                <span class="material-symbols-outlined">subdirectory_arrow_right</span>
            </button>
        </div>

        <div class="wrapper tickerSettings">
			<span class="pre-icon material-symbols-outlined">
				abc
			  </span>
            <label for="tickerText">Lauftext: </label>
            <div class="ticker-input-wrapper">
                <input id="tickerText" onkeydown="submitTicker(event)" oninput="updateTickerClearBtn()" placeholder="Kein Lauftext"/>
                <button class="clearBtn" id="tickerClearBtn" onclick="clearTicker()" title="Lauftext leeren">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <input id="tickerColor" onchange="setTickerColor(event)" type="color" value="#ffffff"/>
            <input id="tickerBackgroundColor" onchange="setTickerBackgroundColor(event)" type="color" value="#111111"/>

            <button onclick="setTicker()">
                <span class="material-symbols-outlined">subdirectory_arrow_right</span>
            </button>
        </div>
    </div>
</div>

<div class="message hidden">
    <button class="cap-btn" onClick="closeMessage()">
        <span class="material-symbols-outlined">close</span>
    </button>
    <span class="text">Ein Update!</span>
</div>

<script src="control.js"></script>
</body>
</html>
